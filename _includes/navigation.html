<!-- Begin Menu Navigation -->
{% assign speaking_urls = "/speaking,/speakerkit,/topics" | split: "," %}
<nav class="navbar navbar-expand-lg navbar-dark fixed-top site-nav" aria-label="Main">
    <div class="container">
        <a class="navbar-brand" href="{{ site.baseurl }}/"><span class="thin">Mishaal</span> Khan</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>
                        <i class="fas fa-home" aria-hidden="true"></i> Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle{% if speaking_urls contains page.url %} active{% endif %}" id="navSpeakingDropdown" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false" href="{{ site.baseurl }}/speaking">
                        <i class="fas fa-masks-theater" aria-hidden="true"></i> Speaking</a>

                    <div class="dropdown-menu" aria-labelledby="navSpeakingDropdown">
                        <a class="dropdown-item" href="{{ site.baseurl }}/speaking"><i class="fa-solid fa-cubes" aria-hidden="true"></i> Packages</a>
                        <a class="dropdown-item" href="{{ site.baseurl }}/speakerkit"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Speaker Kit</a>
                        <a class="dropdown-item" href="{{ site.baseurl }}/topics"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i> Topics</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if page.url == '/events' %} active{% endif %}" href="{{ site.baseurl }}/events"{% if page.url == '/events' %} aria-current="page"{% endif %}>
                        <i class="fa-regular fa-calendar-days" aria-hidden="true"></i> Events</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle{% if page.url == '/resources' %} active{% endif %}" id="navResourcesDropdown" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false" href="{{ site.baseurl }}/resources">
                        <i class="fas fa-bookmark" aria-hidden="true"></i> Resources</a>

                    <div class="dropdown-menu" aria-labelledby="navResourcesDropdown">
                        <a class="dropdown-item" href="{{ site.baseurl }}/resources"><i class="fa-brands fa-youtube" aria-hidden="true"></i> Videos/Podcasts</a>
                        <a class="dropdown-item" href="https://www.PhantomCISO.com/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-book" aria-hidden="true"></i> Book</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if page.url == '/bio' %} active{% endif %}" href="{{ site.baseurl }}/bio"{% if page.url == '/bio' %} aria-current="page"{% endif %}>
                        <i class="fa-solid fa-id-badge" aria-hidden="true"></i> Bio</a>
                </li>
                <li class="nav-item nav-cta">
                    <a class="nav-link{% if page.url == '/contact' %} active{% endif %}" href="{{ site.baseurl }}/contact"{% if page.url == '/contact' %} aria-current="page"{% endif %}>
                        <i class="fa-solid fa-envelope-circle-check" aria-hidden="true"></i> Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
